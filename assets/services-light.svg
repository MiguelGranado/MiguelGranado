<text x="480" y="27" text-anchor="middle" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#64748B">miguel@ulamander — services.sh</text>
<text x="48" y="86" font-size="11" letter-spacing="2.5" font-weight="700" fill="#C2410C">SERVICES</text>
<text x="48" y="120" font-size="24" font-weight="800" fill="#0F172A">From idea to system in production</text>
<text x="48" y="146" font-size="14.5" fill="#475569">End-to-end engineering services for companies that want to automate, scale and secure their operations.</text>
<rect x="48.0" y="178.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="64.0" y="205" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">01</text>
<text x="90.0" y="206" font-size="14" font-weight="700" fill="#0F172A">Software Development</text>
<text x="64.0" y="230.0" font-size="12.5" fill="#475569">Web apps, APIs and scalable</text>
<text x="64.0" y="248.0" font-size="12.5" fill="#475569">backend systems built with modern</text>
<text x="64.0" y="266.0" font-size="12.5" fill="#475569">architectures.</text>
<rect x="340.7" y="178.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="356.7" y="205" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">02</text>
<text x="382.7" y="206" font-size="14" font-weight="700" fill="#0F172A">Business Automation</text>
<text x="356.7" y="230.0" font-size="12.5" fill="#475569">Automated workflows with n8n,</text>
<text x="356.7" y="248.0" font-size="12.5" fill="#475569">webhooks and integrations to</text>
<text x="356.7" y="266.0" font-size="12.5" fill="#475569">eliminate repetitive tasks.</text>
<rect x="633.3" y="178.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="649.3" y="205" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">03</text>
<text x="675.3" y="206" font-size="14" font-weight="700" fill="#0F172A">AI Implementation</text>
<text x="649.3" y="230.0" font-size="12.5" fill="#475569">AI agents, chatbots, RAG and</text>
<text x="649.3" y="248.0" font-size="12.5" fill="#475569">custom LLMs tailored to your</text>
<text x="649.3" y="266.0" font-size="12.5" fill="#475569">business needs.</text>
<rect x="48.0" y="294.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="64.0" y="321" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">04</text>
<text x="90.0" y="322" font-size="14" font-weight="700" fill="#0F172A">API Integration</text>
<text x="64.0" y="346.0" font-size="12.5" fill="#475569">Robust connections between</text>
<text x="64.0" y="364.0" font-size="12.5" fill="#475569">systems, CRMs and external</text>
<text x="64.0" y="382.0" font-size="12.5" fill="#475569">services via REST and webhooks.</text>
<rect x="340.7" y="294.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="356.7" y="321" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">05</text>
<text x="382.7" y="322" font-size="14" font-weight="700" fill="#0F172A">Cloud Infrastructure</text>
<text x="356.7" y="346.0" font-size="12.5" fill="#475569">VPS deployment, Docker containers</text>
<text x="356.7" y="364.0" font-size="12.5" fill="#475569">and Oracle Cloud &amp; Azure</text>
<text x="356.7" y="382.0" font-size="12.5" fill="#475569">architecture, production-ready.</text>
<rect x="633.3" y="294.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="649.3" y="321" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">06</text>
<text x="675.3" y="322" font-size="14" font-weight="700" fill="#0F172A">Tech Consulting</text>
<text x="649.3" y="346.0" font-size="12.5" fill="#475569">End-to-end tech strategy: what to</text>
<text x="649.3" y="364.0" font-size="12.5" fill="#475569">build, how to secure it and where</text>
<text x="649.3" y="382.0" font-size="12.5" fill="#475569">to apply AI.</text>
<rect x="48.0" y="410.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="64.0" y="437" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">07</text>
<text x="90.0" y="438" font-size="14" font-weight="700" fill="#0F172A">AI Full Stack · E-commerce</text>
<text x="64.0" y="462.0" font-size="12.5" fill="#475569">Sites and stores with Claude Code:</text>
<text x="64.0" y="480.0" font-size="12.5" fill="#475569">WordPress, Shopify,</text>
<text x="64.0" y="498.0" font-size="12.5" fill="#475569">high-conversion landing pages.</text>
<rect x="340.7" y="410.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="356.7" y="437" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">08</text>
<text x="382.7" y="438" font-size="14" font-weight="700" fill="#0F172A">Server &amp; NAS Configuration</text>
<text x="356.7" y="462.0" font-size="12.5" fill="#475569">Linux, Docker Compose, VPS, UGREEN</text>
<text x="356.7" y="480.0" font-size="12.5" fill="#475569">NAS, nginx, SSL, tunnel and</text>
<text x="356.7" y="498.0" font-size="12.5" fill="#475569">production deploy.</text>
<rect x="633.3" y="410.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="649.3" y="437" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">09</text>
<text x="675.3" y="438" font-size="14" font-weight="700" fill="#0F172A">Cybersecurity &amp; Hardening</text>
<text x="649.3" y="462.0" font-size="12.5" fill="#475569">Fortinet, Azure Sentinel,</text>
<text x="649.3" y="480.0" font-size="12.5" fill="#475569">firewall, hardening, backup, audit</text>
<text x="649.3" y="498.0" font-size="12.5" fill="#475569">and data protection.</text>
<rect x="48.0" y="526.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="64.0" y="553" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">10</text>
<text x="90.0" y="554" font-size="14" font-weight="700" fill="#0F172A">Database &amp; Backend</text>
<text x="64.0" y="578.0" font-size="12.5" fill="#475569">PostgreSQL, schema design, RLS,</text>
<text x="64.0" y="596.0" font-size="12.5" fill="#475569">REST APIs, JWT/OAuth and</text>
<text x="64.0" y="614.0" font-size="12.5" fill="#475569">multi-tenant SaaS.</text>
<rect x="340.7" y="526.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="356.7" y="553" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">11</text>
<text x="382.7" y="554" font-size="14" font-weight="700" fill="#0F172A">DevOps &amp; Monitoring</text>
<text x="356.7" y="578.0" font-size="12.5" fill="#475569">CI/CD, containers, logs,</text>
<text x="356.7" y="596.0" font-size="12.5" fill="#475569">healthchecks, rollback and</text>
<text x="356.7" y="614.0" font-size="12.5" fill="#475569">operational maintenance.</text>
<rect x="633.3" y="526.0" width="278.7" height="102" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="649.3" y="553" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">12</text>
<text x="675.3" y="554" font-size="14" font-weight="700" fill="#0F172A">GDPR · Privacy · EU AI Act</text>
<text x="649.3" y="578.0" font-size="12.5" fill="#475569">Data compliance, privacy policy,</text>
<text x="649.3" y="596.0" font-size="12.5" fill="#475569">cookies, client protection and EU</text>
<text x="649.3" y="614.0" font-size="12.5" fill="#475569">AI Act readiness.</text>
<text x="48" y="672" font-size="11" letter-spacing="2.5" font-weight="700" fill="#C2410C">METHOD</text>
<text x="48" y="698" font-size="18" font-weight="800" fill="#0F172A">Full Stack end-to-end: from design to deploy</text>
