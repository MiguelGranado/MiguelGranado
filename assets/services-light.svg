<rect x="48.0" y="836.0" width="425.0" height="94" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<circle cx="76.0" cy="862" r="14" fill="#fe702d"/>
<text x="76.0" y="866.5" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#FFFFFF">03</text>
<text x="100.0" y="867" font-size="14" font-weight="700" fill="#0F172A">AI &amp; Automation</text>
<text x="64.0" y="896.0" font-size="12.5" fill="#475569">Local LLMs (Ollama), n8n agent workflows, intent</text>
