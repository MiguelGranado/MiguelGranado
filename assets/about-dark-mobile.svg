<text x="24" y="80" font-size="11" letter-spacing="2.5" font-weight="700" fill="#fe702d">ABOUT ME</text>
<text x="24" y="110.0" font-size="21" fill="#F8FAFC" font-weight="800">Founder &amp; CEO of Ulamander — AI</text>
<text x="24" y="138.0" font-size="21" fill="#F8FAFC" font-weight="800">Development Technician &amp; Full Stack</text>
<text x="24" y="166.0" font-size="21" fill="#F8FAFC" font-weight="800">Engineer.</text>
<text x="24" y="194.0" font-size="16" fill="#A8B3C7">I&#x27;m Miguel Granados, an IT professional</text>
<text x="24" y="217.0" font-size="16" fill="#A8B3C7">specialised in artificial intelligence, cloud and</text>
<text x="24" y="240.0" font-size="16" fill="#A8B3C7">cybersecurity. As founder of Ulamander</text>
<text x="24" y="263.0" font-size="16" fill="#A8B3C7">Corporation, I help companies and professionals</text>
<text x="24" y="286.0" font-size="16" fill="#A8B3C7">turn complex processes into concrete digital</text>
<text x="24" y="309.0" font-size="16" fill="#A8B3C7">solutions: from secure cloud infrastructure to AI</text>
<text x="24" y="332.0" font-size="16" fill="#A8B3C7">agents and workflow automation.</text>
<text x="24" y="363.0" font-size="16" fill="#A8B3C7">I combine continuously updated technical expertise</text>
<text x="24" y="386.0" font-size="16" fill="#A8B3C7">with a results-driven mindset to build real,</text>
<text x="24" y="409.0" font-size="16" fill="#A8B3C7">scalable, production-ready systems — designed to</text>
<text x="24" y="432.0" font-size="16" fill="#A8B3C7">grow your business.</text>
