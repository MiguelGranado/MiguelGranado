<text x="24" y="80" font-size="11" letter-spacing="2.5" font-weight="700" fill="#fe702d">ABOUT ME</text>
<text x="24" y="110.0" font-size="21" fill="#F8FAFC" font-weight="800">Founder &amp; CEO of Ulamander — AI</text>
<text x="24" y="138.0" font-size="21" fill="#F8FAFC" font-weight="800">Development Technician &amp; Full Stack</text>
<text x="24" y="166.0" font-size="21" fill="#F8FAFC" font-weight="800">Engineer.</text>
<text x="24" y="194.0" font-size="16" fill="#A8B3C7">IT professional specialised in AI, cloud and</text>
<text x="24" y="217.0" font-size="16" fill="#A8B3C7">cybersecurity — from secure infrastructure to AI</text>
<text x="24" y="240.0" font-size="16" fill="#A8B3C7">agents and workflow automation.</text>
<rect x="24" y="264" width="432" height="125.0" rx="10" fill="#17213A"/>
<rect x="24" y="264" width="4" height="125.0" rx="2" fill="#fe702d"/>
<text x="50" y="298.5" font-size="16.5" fill="#F8FAFC" font-style="italic">I turn complex processes into intelligent</text>
<text x="50" y="323.0" font-size="16.5" fill="#F8FAFC" font-style="italic">AI-driven systems.</text>
<text x="50" y="347.5" font-size="15" fill="#A8B3C7">I design and ship frontend, backend, cloud,</text>
<text x="50" y="370.5" font-size="15" fill="#A8B3C7">automations and AI systems to production.</text>
<rect x="24.0" y="405.0" width="134.7" height="68" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)"/>
<text x="40.0" y="439.0" font-size="22" font-weight="800" fill="#fe702d">15</text>
<text x="40.0" y="459.0" font-size="12.5" fill="#A8B3C7">MS Learn level</text>
<rect x="172.7" y="405.0" width="134.7" height="68" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)"/>
<text x="188.7" y="439.0" font-size="22" font-weight="800" fill="#fe702d">99</text>
<text x="188.7" y="459.0" font-size="12.5" fill="#A8B3C7">verified credentials</text>
<rect x="321.3" y="405.0" width="134.7" height="68" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)"/>
<text x="337.3" y="439.0" font-size="22" font-weight="800" fill="#fe702d">4</text>
<text x="337.3" y="459.0" font-size="12.5" fill="#A8B3C7">live products</text>
<text x="24" y="513.0" font-size="11" letter-spacing="2.5" font-weight="700" fill="#fe702d">HOW I DELIVER</text>
<rect x="24.0" y="529.0" width="432.0" height="92" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)" stroke-width="1.2"/>
<rect x="42.0" y="549.0" width="8" height="8" rx="2" fill="#fe702d" transform="rotate(45 46.0 553.0)"/>
<text x="60.0" y="558.0" font-size="16.5" font-weight="700" fill="#F8FAFC">I ship real systems</text>
<text x="42.0" y="583.0" font-size="15" fill="#A8B3C7">Not just prototypes: Web, App, Neural, CRM and</text>
<text x="42.0" y="604.0" font-size="15" fill="#A8B3C7">corporate mail already in production.</text>
<rect x="24.0" y="633.0" width="432.0" height="92" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)" stroke-width="1.2"/>
<rect x="42.0" y="653.0" width="8" height="8" rx="2" fill="#fe702d" transform="rotate(45 46.0 657.0)"/>
<text x="60.0" y="662.0" font-size="16.5" font-weight="700" fill="#F8FAFC">Full Stack + AI</text>
<text x="42.0" y="687.0" font-size="15" fill="#A8B3C7">React/TypeScript, Node, Postgres, local LLMs</text>
<text x="42.0" y="708.0" font-size="15" fill="#A8B3C7">(Ollama) and n8n agents in one delivery flow.</text>
<rect x="24.0" y="737.0" width="432.0" height="92" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)" stroke-width="1.2"/>
<rect x="42.0" y="757.0" width="8" height="8" rx="2" fill="#fe702d" transform="rotate(45 46.0 761.0)"/>
<text x="60.0" y="766.0" font-size="16.5" font-weight="700" fill="#F8FAFC">Security-first mindset</text>
<text x="42.0" y="791.0" font-size="15" fill="#A8B3C7">Azure/Sentinel, Fortinet, DNS/SPF/DKIM and</text>
<text x="42.0" y="812.0" font-size="15" fill="#A8B3C7">operational hardening on the stack.</text>
<rect x="24.0" y="841.0" width="432.0" height="92" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)" stroke-width="1.2"/>
<rect x="42.0" y="861.0" width="8" height="8" rx="2" fill="#fe702d" transform="rotate(45 46.0 865.0)"/>
<text x="60.0" y="870.0" font-size="16.5" font-weight="700" fill="#F8FAFC">One end-to-end owner</text>
<text x="42.0" y="895.0" font-size="15" fill="#A8B3C7">From idea to deploy (UI, API, cloud, mail,</text>
<text x="42.0" y="916.0" font-size="15" fill="#A8B3C7">tunnel) without splitting the project.</text>
<circle cx="30" cy="966.0" r="4" fill="#fbbf24"/>
<text x="44" y="971.0" font-size="13.5" fill="#64748B">Turin, Italy — remote &amp; on-site · reply within 24 hours</text>
