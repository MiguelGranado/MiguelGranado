<circle cx="28" cy="23" r="5" fill="#FF5F56"/>
<circle cx="48" cy="23" r="5" fill="#FFBD2E"/>
<circle cx="68" cy="23" r="5" fill="#27C93F"/>
<text x="240" y="27" text-anchor="middle" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#64748B">services.sh</text>
<text x="24" y="80" font-size="11" letter-spacing="2.5" font-weight="700" fill="#C2410C">SERVICES</text>
<text x="24" y="110" font-size="21" font-weight="800" fill="#0F172A">From idea to system in</text>
<text x="24" y="138" font-size="21" font-weight="800" fill="#0F172A">production</text>
<text x="24" y="164" font-size="14" fill="#475569">End-to-end engineering services for companies that want to</text>
<text x="24" y="184" font-size="14" fill="#475569">automate, scale and secure their operations.</text>
<rect x="24.0" y="216.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="243" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">01</text>
<text x="66.0" y="244" font-size="16" font-weight="700" fill="#0F172A">Software Development</text>
<text x="40.0" y="268.0" font-size="14.5" fill="#475569">Web apps, APIs and scalable backend systems built</text>
<text x="40.0" y="289.0" font-size="14.5" fill="#475569">with modern architectures.</text>
<rect x="24.0" y="316.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="343" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">02</text>
<text x="66.0" y="344" font-size="16" font-weight="700" fill="#0F172A">Business Automation</text>
<text x="40.0" y="368.0" font-size="14.5" fill="#475569">Automated workflows with n8n, webhooks and</text>
<text x="40.0" y="389.0" font-size="14.5" fill="#475569">integrations to eliminate repetitive tasks.</text>
<rect x="24.0" y="416.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="443" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">03</text>
<text x="66.0" y="444" font-size="16" font-weight="700" fill="#0F172A">AI Implementation</text>
<text x="40.0" y="468.0" font-size="14.5" fill="#475569">AI agents, chatbots, RAG and custom LLMs tailored</text>
<text x="40.0" y="489.0" font-size="14.5" fill="#475569">to your business needs.</text>
<rect x="24.0" y="516.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="543" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">04</text>
<text x="66.0" y="544" font-size="16" font-weight="700" fill="#0F172A">API Integration</text>
<text x="40.0" y="568.0" font-size="14.5" fill="#475569">Robust connections between systems, CRMs and</text>
<text x="40.0" y="589.0" font-size="14.5" fill="#475569">external services via REST and webhooks.</text>
<rect x="24.0" y="616.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="643" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">05</text>
<text x="66.0" y="644" font-size="16" font-weight="700" fill="#0F172A">Cloud Infrastructure</text>
<text x="40.0" y="668.0" font-size="14.5" fill="#475569">VPS deployment, Docker containers and Oracle Cloud</text>
<text x="40.0" y="689.0" font-size="14.5" fill="#475569">&amp; Azure architecture, production-ready.</text>
<rect x="24.0" y="716.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="743" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">06</text>
<text x="66.0" y="744" font-size="16" font-weight="700" fill="#0F172A">Tech Consulting</text>
<text x="40.0" y="768.0" font-size="14.5" fill="#475569">End-to-end tech strategy: what to build, how to</text>
<text x="40.0" y="789.0" font-size="14.5" fill="#475569">secure it and where to apply AI.</text>
<rect x="24.0" y="816.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="843" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">07</text>
<text x="66.0" y="844" font-size="16" font-weight="700" fill="#0F172A">AI Full Stack · E-commerce</text>
<text x="40.0" y="868.0" font-size="14.5" fill="#475569">Sites and stores with Claude Code: WordPress,</text>
<text x="40.0" y="889.0" font-size="14.5" fill="#475569">Shopify, high-conversion landing pages.</text>
<rect x="24.0" y="916.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="943" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">08</text>
<text x="66.0" y="944" font-size="16" font-weight="700" fill="#0F172A">Server &amp; NAS Configuration</text>
<text x="40.0" y="968.0" font-size="14.5" fill="#475569">Linux, Docker Compose, VPS, UGREEN NAS, nginx,</text>
<text x="40.0" y="989.0" font-size="14.5" fill="#475569">SSL, tunnel and production deploy.</text>
<rect x="24.0" y="1016.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="1043" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">09</text>
<text x="66.0" y="1044" font-size="16" font-weight="700" fill="#0F172A">Cybersecurity &amp; Hardening</text>
<text x="40.0" y="1068.0" font-size="14.5" fill="#475569">Fortinet, Azure Sentinel, firewall, hardening,</text>
<text x="40.0" y="1089.0" font-size="14.5" fill="#475569">backup, audit and data protection.</text>
<rect x="24.0" y="1116.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="1143" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">10</text>
<text x="66.0" y="1144" font-size="16" font-weight="700" fill="#0F172A">Database &amp; Backend</text>
<text x="40.0" y="1168.0" font-size="14.5" fill="#475569">PostgreSQL, schema design, RLS, REST APIs,</text>
<text x="40.0" y="1189.0" font-size="14.5" fill="#475569">JWT/OAuth and multi-tenant SaaS.</text>
<rect x="24.0" y="1216.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="1243" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">11</text>
<text x="66.0" y="1244" font-size="16" font-weight="700" fill="#0F172A">DevOps &amp; Monitoring</text>
<text x="40.0" y="1268.0" font-size="14.5" fill="#475569">CI/CD, containers, logs, healthchecks, rollback</text>
<text x="40.0" y="1289.0" font-size="14.5" fill="#475569">and operational maintenance.</text>
<rect x="24.0" y="1316.0" width="432.0" height="90" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<text x="40.0" y="1343" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#C2410C">12</text>
<text x="66.0" y="1344" font-size="16" font-weight="700" fill="#0F172A">GDPR · Privacy · EU AI Act</text>
<text x="40.0" y="1368.0" font-size="14.5" fill="#475569">Data compliance, privacy policy, cookies, client</text>
<text x="40.0" y="1389.0" font-size="14.5" fill="#475569">protection and EU AI Act readiness.</text>
<text x="24" y="1450" font-size="11" letter-spacing="2.5" font-weight="700" fill="#C2410C">METHOD</text>
<text x="24" y="1476" font-size="17" font-weight="800" fill="#0F172A">Full Stack end-to-end: from design</text>
<text x="24" y="1500" font-size="17" font-weight="800" fill="#0F172A">to deploy</text>
<rect x="24.0" y="1530.0" width="432.0" height="100" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<circle cx="52.0" cy="1556" r="14" fill="#fe702d"/>
<text x="52.0" y="1560.5" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#FFFFFF">01</text>
<text x="76.0" y="1561" font-size="16" font-weight="700" fill="#0F172A">Design &amp; UX</text>
<text x="40.0" y="1590.0" font-size="14.5" fill="#475569">Brand-first interfaces, clear flows, reusable</text>
<text x="40.0" y="1611.0" font-size="14.5" fill="#475569">components.</text>
<rect x="24.0" y="1640.0" width="432.0" height="100" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<circle cx="52.0" cy="1666" r="14" fill="#fe702d"/>
<text x="52.0" y="1670.5" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#FFFFFF">02</text>
<text x="76.0" y="1671" font-size="16" font-weight="700" fill="#0F172A">Frontend &amp; Backend</text>
<text x="40.0" y="1700.0" font-size="14.5" fill="#475569">React/Vite, APIs, auth, Postgres/Supabase, SaaS</text>
<text x="40.0" y="1721.0" font-size="14.5" fill="#475569">panels.</text>
<rect x="24.0" y="1750.0" width="432.0" height="100" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<circle cx="52.0" cy="1776" r="14" fill="#fe702d"/>
<text x="52.0" y="1780.5" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#FFFFFF">03</text>
<text x="76.0" y="1781" font-size="16" font-weight="700" fill="#0F172A">AI &amp; Automation</text>
<text x="40.0" y="1810.0" font-size="14.5" fill="#475569">Local LLMs (Ollama), n8n agent workflows, intent</text>
<text x="40.0" y="1831.0" font-size="14.5" fill="#475569">routing.</text>
<rect x="24.0" y="1860.0" width="432.0" height="100" rx="12" fill="#FFFFFF" stroke="rgba(234,88,12,0.28)" stroke-width="1.2"/>
<circle cx="52.0" cy="1886" r="14" fill="#fe702d"/>
<text x="52.0" y="1890.5" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#FFFFFF">04</text>
<text x="76.0" y="1891" font-size="16" font-weight="700" fill="#0F172A">Cloud, NAS &amp; Security</text>
<text x="40.0" y="1920.0" font-size="14.5" fill="#475569">Docker, Cloudflare Tunnel, corporate mail,</text>
<text x="40.0" y="1941.0" font-size="14.5" fill="#475569">DNS/SPF, hardening.</text>
</g>
