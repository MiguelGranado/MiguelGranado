<text x="64.0" y="896.0" font-size="12.5" fill="#A8B3C7">Local LLMs (Ollama), n8n agent workflows, intent</text>
<text x="64.0" y="914.0" font-size="12.5" fill="#A8B3C7">routing.</text>
<rect x="487.0" y="836.0" width="425.0" height="94" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)" stroke-width="1.2"/>
