<text x="515.0" y="758.5" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#FFFFFF">02</text>
<text x="539.0" y="759" font-size="14" font-weight="700" fill="#F8FAFC">Frontend &amp; Backend</text>
<text x="503.0" y="788.0" font-size="12.5" fill="#A8B3C7">React/Vite, APIs, auth, Postgres/Supabase, SaaS</text>
<text x="503.0" y="806.0" font-size="12.5" fill="#A8B3C7">panels.</text>
<rect x="48.0" y="836.0" width="425.0" height="94" rx="12" fill="#1A2336" stroke="rgba(254,112,45,0.30)" stroke-width="1.2"/>
