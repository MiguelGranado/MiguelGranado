<text x="508.0" y="501.5" font-size="13.5" fill="#A8B3C7">React/TypeScript, Node, Postgres, local LLMs</text>
<text x="508.0" y="520.5" font-size="13.5" fill="#A8B3C7">(Ollama) and n8n agents in one delivery flow.</text>
