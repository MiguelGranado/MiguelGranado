<text x="48" y="86" font-size="11" letter-spacing="2.5" font-weight="700" fill="#fe702d">ABOUT ME</text>
<text x="48" y="120.0" font-size="24" fill="#F8FAFC" font-weight="800">Founder &amp; CEO of Ulamander — AI Development Technician &amp; Full</text>
