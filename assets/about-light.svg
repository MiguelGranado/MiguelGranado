<text x="48" y="201.5" font-size="15.5" fill="#475569">cybersecurity. As founder of Ulamander Corporation, I help companies and professionals turn complex</text>
<text x="48" y="224.0" font-size="15.5" fill="#475569">processes into concrete digital solutions: from secure cloud infrastructure to AI agents and workflow</text>
<text x="48" y="246.5" font-size="15.5" fill="#475569">automation.</text>
<text x="48" y="277.0" font-size="15.5" fill="#475569">I combine continuously updated technical expertise with a results-driven mindset to build real,</text>
<text x="48" y="299.5" font-size="15.5" fill="#475569">scalable, production-ready systems — designed to grow your business.</text>
