name: Generate Projects Panel

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "logos/**"
      - "scripts/hero/design.py"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/fetch_data.py"
      - ".github/workflows/projects.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Language data is real byte counts already stored in projects.json by
      # .github/scripts/refresh_languages.py (private repos are not readable
      # with this token). This step only validates and copies the file.
      - name: Validate project data
        run: python3 .github/scripts/fetch_data.py

      - name: Generate projects panel (desktop + mobile, dark + light)
        run: python3 .github/scripts/generate_projects.py merged.json out

      - name: Push to projects branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Update projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
