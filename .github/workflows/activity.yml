name: Generate Contribution Skyline and Achievements

on:
  schedule:
    - cron: "17 * * * *"          # hourly: contributions show up within the hour
  push:
    branches: [main]
    paths:
      - "scripts/hero/build_activity.py"
      - "scripts/hero/build_skyline.py"
      - "scripts/hero/build_achievements.py"
      - "scripts/hero/design.py"
      - ".github/workflows/activity.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Real data only: GitHub's own contribution calendar via GraphQL, as a
      # heat map that folds into a 3D skyline (+ contributions.json for the site).
      - name: Build skyline panel from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/hero/build_skyline.py out

      # Achievements exactly as GitHub shows them (tier images + x2/x3); a newly
      # awarded achievement appears on the next hourly run.
      - name: Build achievements panel from the GitHub profile
        run: python3 scripts/hero/build_achievements.py out

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: out
          commit_message: "Update contribution activity [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # repository activity. Re-enabling this workflow through the API on every
      # run resets that timer, so the hourly refresh never stops on its own.
      - name: Keep the hourly schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/activity.yml/enable"
